[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "crates/slt", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ToxFied/Fishbowl"
rust-version = "1.85"

[workspace.dependencies]
fishbowl = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.63"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# The browser build trades a little speed for a much smaller download.
[profile.wasm]
inherits = "release"
opt-level = "s"
